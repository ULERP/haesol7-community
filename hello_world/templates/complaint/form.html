{% extends 'base_2panel.html' %}
{% block content %}
<div class="row justify-content-center">
<div class="col-lg-7">
<h4 class="fw-bold mb-4"><i class="bi bi-megaphone me-2 text-wine"></i>민원/오류 접수</h4>
<div class="card shadow-sm">
  <div class="card-body">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-semibold">분류</label>
        <select name="category" class="form-select">
          <option value="">-- 분류 선택 --</option>
          {% for cat in categories %}
          <option value="{{ cat.pk }}">{{ cat.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">제목 <span class="text-danger">*</span></label>
        <input type="text" name="title" class="form-control" required maxlength="100" placeholder="민원/오류 제목">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">내용 <span class="text-danger">*</span></label>
        <textarea name="content" class="form-control" rows="6" required placeholder="내용을 자세히 입력해주세요"></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold"><i class="fas fa-map-marker-alt me-1 text-wine"></i>위치 <small class="text-muted">(선택)</small></label>
        <input type="text" name="location" class="form-control" maxlength="100" placeholder="예: 지하주차장 B2, 101동 앞, 놀이터 등">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold"><i class="fas fa-camera me-1 text-wine"></i>사진 첨부 <small class="text-muted">(선택 · 최대 5장)</small></label>
        <input type="file" name="images" id="imageInput" class="form-control" accept="image/*" multiple>
        <div id="imagePreview" class="d-flex flex-wrap gap-2 mt-2"></div>
        <small class="text-muted">JPG, PNG, GIF 지원 · 장당 최대 10MB</small>
      </div>
      <div class="mb-3 form-check">
        <input type="checkbox" name="is_anonymous" id="isAnon" class="form-check-input">
        <label for="isAnon" class="form-check-label">익명으로 접수 <small class="text-muted">(관리자에게만 작성자 공개)</small></label>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-wine"><i class="bi bi-send me-1"></i>접수하기</button>
        <a href="{% url 'complaint_list' %}" class="btn btn-outline-secondary">취소</a>
      </div>
    </form>
  </div>
</div>
</div>
</div>

<script>
document.getElementById('imageInput').addEventListener('change', function() {
  const preview = document.getElementById('imagePreview');
  preview.innerHTML = '';
  const files = Array.from(this.files).slice(0, 5);
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      const div = document.createElement('div');
      div.style.cssText = 'position:relative;width:80px;height:80px;';
      div.innerHTML = `<img src="${e.target.result}" style="width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid #e5e7eb;">`;
      preview.appendChild(div);
    };
    reader.readAsDataURL(file);
  });
});
</script>
{% endblock %}
