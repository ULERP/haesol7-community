{% comment %}
공통 캘린더 위젯 파셜
사용법: {% include 'partials/calendar_widget.html' with group_id=group.pk is_leader=is_leader %}
group_id 없으면 통합 캘린더, 있으면 소모임 캘린더
{% endcomment %}
<script src="https://cdn.jsdelivr.net/npm/rrule@2.7.2/dist/es5/rrule.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/6.1.11/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/rrule@6.1.11/index.global.min.js"></script>
<style>
.cal-widget .fc { font-size:0.82rem; }
.cal-widget .fc-toolbar-title { font-size:0.95rem !important; font-weight:700; }
.cal-widget .fc-button { font-size:0.75rem !important; padding:3px 8px !important; background:#7A263A !important; border-color:#7A263A !important; }
.cal-widget .fc-daygrid-event,.cal-widget .fc-timegrid-event { border-radius:4px; font-size:0.7rem; cursor:pointer; }
.cal-widget .fc-daygrid-day:hover { background:#fdf5f6 !important; cursor:pointer; }
.cal-widget .fc-timegrid-slot { height:1.8rem !important; }
.cw-type-btn,.cw-vis-btn { border:1.5px solid #ddd;background:#fff;border-radius:20px;padding:4px 10px;font-size:0.75rem;cursor:pointer;transition:.15s; }
.cw-type-btn.active { background:#242424;color:#fff;border-color:#242424; }
.cw-vis-btn.active  { background:#7A263A;color:#fff;border-color:#7A263A; }
.cw-color-swatch { width:24px;height:24px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:.15s;flex-shrink:0; }
.cw-color-swatch.selected { border-color:#333 !important; transform:scale(1.2); }
</style>

<!-- 이벤트 상세 모달 -->
<div class="modal fade" id="cwEventModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content" style="border-radius:14px;">
      <div class="modal-header py-2" style="border-bottom:2px solid #D4B26A;">
        <h6 class="modal-title fw-bold" id="cwEvTitle"></h6>
        <button type="button" class="btn-close btn-sm" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body py-2" id="cwEvBody"></div>
      <div class="modal-footer py-2 gap-1 flex-wrap">
        <a href="#" id="cwEvDetail" class="btn btn-sm text-white d-none" style="background:#7A263A;border-radius:20px;font-size:0.78rem;">📋 상세</a>
        <button id="cwEvApprove" class="btn btn-sm btn-success d-none" style="font-size:0.78rem;" onclick="cwApproveEvent()">✅ 승인</button>
        <button id="cwEvEdit"    class="btn btn-sm btn-outline-secondary d-none" style="font-size:0.78rem;" onclick="cwOpenEdit()">✏️ 수정</button>
        <button id="cwEvDelete"  class="btn btn-sm btn-danger d-none" style="font-size:0.78rem;" onclick="cwDeleteEvent()">🗑 삭제</button>
        <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal" style="font-size:0.78rem;">닫기</button>
      </div>
    </div>
  </div>
</div>

<!-- 일정 등록/수정 모달 -->
<div class="modal fade" id="cwCreateModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content" style="border-radius:14px;">
      <div class="modal-header py-2 text-white" style="background:#7A263A;border-radius:14px 14px 0 0;">
        <h6 class="modal-title fw-bold" id="cwModalTitle">📅 일정 등록</h6>
        <button type="button" class="btn-close btn-close-white btn-sm" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" style="max-height:72vh;overflow-y:auto;">
        <input type="hidden" id="cwEditId" value="">
        <!-- 제목 -->
        <div class="mb-2">
          <label class="form-label small fw-bold">제목 <span class="text-danger">*</span></label>
          <input type="text" id="cwTitle" class="form-control form-control-sm" placeholder="일정 제목">
        </div>
        <!-- 종류 -->
        <div class="mb-2">
          <label class="form-label small fw-bold">종류</label>
          <div class="d-flex gap-1 flex-wrap">
            <button type="button" class="cw-type-btn active" data-val="personal" onclick="cwSelType(this)">🙋 개인</button>
            <button type="button" class="cw-type-btn" data-val="event" onclick="cwSelType(this)">📅 단지행사</button>
            <button type="button" class="cw-type-btn" data-val="volunteer" onclick="cwSelType(this)">🤝 봉사</button>
            <button type="button" class="cw-type-btn" data-val="group" onclick="cwSelType(this)">👥 소모임</button>
          </div>
        </div>
        <!-- 소모임 선택 (통합캘린더용) -->
        <div class="mb-2 d-none" id="cwGroupWrap">
          <label class="form-label small fw-bold">소모임</label>
          <select id="cwGroup" class="form-select form-select-sm" onchange="cwUpdateNote()">
            <option value="">-- 선택 --</option>
          </select>
        </div>
        <!-- 공개범위 -->
        <div class="mb-2">
          <label class="form-label small fw-bold">공개범위</label>
          <div class="d-flex gap-1 flex-wrap">
            <button type="button" class="cw-vis-btn active" data-val="private" onclick="cwSelVis(this)">🔒 나만</button>
            <button type="button" class="cw-vis-btn" data-val="group" onclick="cwSelVis(this)">👥 소모임</button>
            <button type="button" class="cw-vis-btn" data-val="public" onclick="cwSelVis(this)">🏘 전체</button>
          </div>
        </div>
        <!-- 안내 -->
        <div id="cwNote" class="alert py-1 small mb-2" style="border-radius:8px;"></div>
        <!-- 종일 -->
        <div class="mb-2">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="cwAllDay" onchange="cwToggleAllDay()">
            <label class="form-check-label small fw-bold" for="cwAllDay">🗓 종일</label>
          </div>
        </div>
        <!-- 시간 -->
        <div class="row g-2 mb-2" id="cwDatetimeWrap">
          <div class="col-6">
            <label class="form-label small fw-bold">시작 *</label>
            <input type="datetime-local" id="cwStart" class="form-control form-control-sm">
          </div>
          <div class="col-6">
            <label class="form-label small fw-bold">종료</label>
            <input type="datetime-local" id="cwEnd" class="form-control form-control-sm">
          </div>
        </div>
        <div class="row g-2 mb-2 d-none" id="cwDateWrap">
          <div class="col-6">
            <label class="form-label small fw-bold">시작일 *</label>
            <input type="date" id="cwStartDate" class="form-control form-control-sm">
          </div>
          <div class="col-6">
            <label class="form-label small fw-bold">종료일</label>
            <input type="date" id="cwEndDate" class="form-control form-control-sm">
          </div>
        </div>
        <!-- 장소/내용 -->
        <div class="mb-2">
          <label class="form-label small fw-bold">장소</label>
          <input type="text" id="cwLocation" class="form-control form-control-sm" placeholder="장소">
        </div>
        <div class="mb-2">
          <label class="form-label small fw-bold">내용</label>
          <textarea id="cwDesc" class="form-control form-control-sm" rows="2"></textarea>
        </div>
        <!-- 색상 -->
        <div class="mb-2">
          <label class="form-label small fw-bold">🎨 색상</label>
          <div class="d-flex gap-2 flex-wrap mt-1" id="cwColorPicker">
            <div class="cw-color-swatch selected" data-color="#7A263A" style="background:#7A263A;" onclick="cwSelColor(this)"></div>
            <div class="cw-color-swatch" data-color="#1a7a4a" style="background:#1a7a4a;" onclick="cwSelColor(this)"></div>
            <div class="cw-color-swatch" data-color="#D4B26A" style="background:#D4B26A;" onclick="cwSelColor(this)"></div>
            <div class="cw-color-swatch" data-color="#3b82f6" style="background:#3b82f6;" onclick="cwSelColor(this)"></div>
            <div class="cw-color-swatch" data-color="#8b5cf6" style="background:#8b5cf6;" onclick="cwSelColor(this)"></div>
            <div class="cw-color-swatch" data-color="#f59e0b" style="background:#f59e0b;" onclick="cwSelColor(this)"></div>
            <div class="cw-color-swatch" data-color="#ef4444" style="background:#ef4444;" onclick="cwSelColor(this)"></div>
            <div class="cw-color-swatch" data-color="#6b7280" style="background:#6b7280;" onclick="cwSelColor(this)"></div>
          </div>
        </div>
        <!-- 반복 -->
        <div class="mb-1">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="cwRecurToggle" onchange="cwToggleRecur()">
            <label class="form-check-label small fw-bold" for="cwRecurToggle">🔁 반복</label>
          </div>
        </div>
        <div id="cwRecurWrap" class="d-none mb-2 p-2 rounded" style="background:#f8f9fa;border:1px solid #e9ecef;">
          <div class="row g-2 mb-2">
            <div class="col-5">
              <select id="cwRecurType" class="form-select form-select-sm" onchange="cwUpdateRecurLabel()">
                <option value="daily">매일</option>
                <option value="weekly" selected>매주</option>
                <option value="monthly">매월</option>
              </select>
            </div>
            <div class="col-4">
              <div class="input-group input-group-sm">
                <input type="number" id="cwRecurInterval" class="form-control" value="1" min="1" max="30">
                <span class="input-group-text" id="cwRecurLabel">주</span>
              </div>
            </div>
          </div>
          <div>
            <label class="form-label small fw-bold">종료일 *</label>
            <input type="date" id="cwRecurEnd" class="form-control form-control-sm">
          </div>
        </div>
      </div>
      <div class="modal-footer py-2">
        <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">취소</button>
        <button type="button" class="btn btn-sm text-white fw-bold" style="background:#7A263A;border-radius:20px;" onclick="cwSubmit()">
          <i class="fas fa-check me-1"></i><span id="cwSubmitLabel">등록하기</span>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
// ── 공통 캘린더 위젯 JS ──
// 페이지에서 cwConfig 객체를 먼저 정의해야 함:
// const cwConfig = { groupId: null, isLeader: false, isStaff: false, isAuth: true, userId: 1, myGroups: [], leaderGroups: [] }

let cwCalendar, cwCurrentEvId=null, cwCurrentEvData={};
let cwSelTypeVal='personal', cwSelVisVal='private', cwSelColorVal='#7A263A';
let cwIsEditMode=false;

function cwInit(calEl) {
  const cfg = window.cwConfig || {};
  cwCalendar = new FullCalendar.Calendar(calEl, {
    initialView: window.innerWidth<768 ? 'listMonth' : 'dayGridMonth',
    locale: 'ko',
    headerToolbar: { left:'prev,next today', center:'title', right:'dayGridMonth,timeGridWeek,timeGridDay,listMonth' },
    buttonText: { today:'오늘', month:'월', week:'주', day:'일', list:'목록' },
    editable: cfg.isAuth,
    droppable: true,
    nowIndicator: true,
    dayMaxEvents: 4,
    slotMinTime: '06:00:00',
    slotMaxTime: '23:00:00',
    height: 'auto',
    eventDrop: function(info) {
      const p=info.event.extendedProps;
      if(!p.cal_id||(!p.can_edit&&!cfg.isStaff)){info.revert();return;}
      cwSaveEdit(p.cal_id, {
        title:      info.event.title,
        start_time: info.event.startStr.substring(0,16).replace('T',' ')+':00',
        end_time:   info.event.endStr?info.event.endStr.substring(0,16).replace('T',' ')+':00':null,
      }, ()=>info.revert());
    },
    eventResize: function(info) {
      const p=info.event.extendedProps;
      if(!p.cal_id||(!p.can_edit&&!cfg.isStaff)){info.revert();return;}
      cwSaveEdit(p.cal_id, {
        title:      info.event.title,
        start_time: info.event.startStr.substring(0,16).replace('T',' ')+':00',
        end_time:   info.event.endStr?info.event.endStr.substring(0,16).replace('T',' ')+':00':null,
      }, ()=>info.revert());
    },
    dateClick: info => { if(cfg.isAuth) cwOpenCreate(info.dateStr); },
    eventClick: info => { info.jsEvent.preventDefault(); cwShowDetail(info.event); },
    eventMouseEnter: i=>{i.el.style.opacity='.8';i.el.style.cursor='pointer';},
    eventMouseLeave: i=>{i.el.style.opacity='1';},
  });

  // 소모임 캘린더면 API로 이벤트 로드
  if(cfg.groupId) {
    fetch(`/groups/${cfg.groupId}/calendar/events/`)
      .then(r=>r.json()).then(data=>{
        cwCalendar.addEventSource(data.events||[]);
        cwCalendar.render();
      });
  } else {
    if(cfg.events) cwCalendar.addEventSource(cfg.events);
    cwCalendar.render();
  }

  // 소모임 선택 채우기
  if(cfg.myGroups) {
    const sel=document.getElementById('cwGroup');
    if(sel) cfg.myGroups.forEach(g=>{
      const o=document.createElement('option');
      o.value=g.id; o.textContent=g.name; sel.appendChild(o);
    });
  }

  // 소모임 캘린더면 종류 기본값을 group으로
  if(cfg.groupId) {
    document.querySelectorAll('.cw-type-btn').forEach(b=>b.classList.remove('active'));
    const grpBtn=document.querySelector('.cw-type-btn[data-val="group"]');
    if(grpBtn){grpBtn.classList.add('active'); cwSelTypeVal='group';}
    // 소모임 공개범위 기본값
    document.querySelectorAll('.cw-vis-btn').forEach(b=>b.classList.remove('active'));
    const grpVis=document.querySelector('.cw-vis-btn[data-val="group"]');
    if(grpVis){grpVis.classList.add('active'); cwSelVisVal='group';}
  }
  cwUpdateNote();
}

function cwShowDetail(ev) {
  const p=ev.extendedProps;
  cwCurrentEvId=p.cal_id||null;
  cwCurrentEvData={
    title:       ev.title.replace(/^[⏳🔒]\s*/,''),
    start:       ev.startStr?ev.startStr.substring(0,16):'',
    end:         ev.endStr?ev.endStr.substring(0,16):'',
    location:    p.location||'',
    description: p.description||'',
    color:       ev.backgroundColor||'#7A263A',
  };
  document.getElementById('cwEvTitle').textContent=ev.title.replace(/^[⏳🔒]\s*/,'');
  const visBadge={'private':'<span class="badge bg-secondary">🔒 나만</span>','group_pending':'<span class="badge bg-warning text-dark">⏳ 소모임대기</span>','group':'<span class="badge bg-warning text-dark">👥 소모임</span>','pending':'<span class="badge bg-warning text-dark">⏳ 전체대기</span>','public':'<span class="badge bg-success">🏘 전체</span>'}[p.visibility]||'';
  document.getElementById('cwEvBody').innerHTML=`
    <div class="mb-1 d-flex gap-1 flex-wrap"><span class="badge bg-dark">${p.type||''}</span>${visBadge}</div>
    ${p.location?`<div class="small mb-1"><i class="fas fa-map-marker-alt text-danger me-1"></i>${p.location}</div>`:''}
    ${p.description?`<div class="small text-muted mb-1">${p.description}</div>`:''}
    ${p.creator?`<div class="small text-muted">작성: ${p.creator}</div>`:''}
    ${ev.startStr?`<div class="small text-muted">${ev.startStr.substring(0,16).replace('T',' ')}</div>`:''}
  `;
  const cfg=window.cwConfig||{};
  document.getElementById('cwEvDetail').href=cwCurrentEvId?`/calendar/${cwCurrentEvId}/`:'#';
  document.getElementById('cwEvDetail').classList.toggle('d-none',!cwCurrentEvId);
  document.getElementById('cwEvApprove').classList.toggle('d-none',!(cwCurrentEvId&&p.can_approve));
  document.getElementById('cwEvEdit').classList.toggle('d-none',!(cwCurrentEvId&&p.can_edit));
  document.getElementById('cwEvDelete').classList.toggle('d-none',!(cwCurrentEvId&&(p.can_edit||cfg.isStaff)));
  new bootstrap.Modal(document.getElementById('cwEventModal')).show();
}

function cwApproveEvent() {
  if(!cwCurrentEvId) return;
  fetch(`/calendar/${cwCurrentEvId}/approve/`,{method:'POST',headers:{'X-CSRFToken':cwGetCsrf()}})
    .then(r=>r.json()).then(res=>{
      if(res.success){bootstrap.Modal.getInstance(document.getElementById('cwEventModal')).hide();cwReload();}
      else alert(res.error||'오류');
    });
}

function cwDeleteEvent() {
  if(!cwCurrentEvId||!confirm('일정을 삭제하시겠습니까?')) return;
  fetch(`/calendar/${cwCurrentEvId}/delete/`,{method:'POST',headers:{'X-CSRFToken':cwGetCsrf()}})
    .then(r=>r.json()).then(res=>{
      if(res.success){bootstrap.Modal.getInstance(document.getElementById('cwEventModal')).hide();cwReload();}
    });
}

function cwOpenEdit() {
  cwIsEditMode=true;
  bootstrap.Modal.getInstance(document.getElementById('cwEventModal')).hide();
  document.getElementById('cwEditId').value=cwCurrentEvId||'';
  document.getElementById('cwTitle').value=cwCurrentEvData.title||'';
  document.getElementById('cwStart').value=cwCurrentEvData.start||'';
  document.getElementById('cwEnd').value=cwCurrentEvData.end||'';
  document.getElementById('cwLocation').value=cwCurrentEvData.location||'';
  document.getElementById('cwDesc').value=cwCurrentEvData.description||'';
  document.getElementById('cwModalTitle').textContent='✏️ 일정 수정';
  document.getElementById('cwSubmitLabel').textContent='수정하기';
  new bootstrap.Modal(document.getElementById('cwCreateModal')).show();
}

function cwOpenCreate(dateStr) {
  cwIsEditMode=false;
  document.getElementById('cwEditId').value='';
  document.getElementById('cwTitle').value='';
  document.getElementById('cwStart').value=dateStr?dateStr+'T09:00':'';
  document.getElementById('cwEnd').value=dateStr?dateStr+'T11:00':'';
  document.getElementById('cwStartDate').value=dateStr||'';
  document.getElementById('cwEndDate').value=dateStr||'';
  document.getElementById('cwLocation').value='';
  document.getElementById('cwDesc').value='';
  document.getElementById('cwModalTitle').textContent='📅 일정 등록';
  document.getElementById('cwSubmitLabel').textContent='등록하기';
  cwUpdateNote();
  new bootstrap.Modal(document.getElementById('cwCreateModal')).show();
}

function cwSelType(btn){
  document.querySelectorAll('.cw-type-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); cwSelTypeVal=btn.dataset.val;
  document.getElementById('cwGroupWrap').classList.toggle('d-none',cwSelTypeVal!=='group');
  cwUpdateNote();
}
function cwSelVis(btn){
  document.querySelectorAll('.cw-vis-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); cwSelVisVal=btn.dataset.val;
  cwUpdateNote();
}
function cwSelColor(el){
  document.querySelectorAll('.cw-color-swatch').forEach(s=>s.classList.remove('selected'));
  el.classList.add('selected'); cwSelColorVal=el.dataset.color;
}
function cwToggleAllDay(){
  const on=document.getElementById('cwAllDay').checked;
  document.getElementById('cwDatetimeWrap').classList.toggle('d-none',on);
  document.getElementById('cwDateWrap').classList.toggle('d-none',!on);
}
function cwToggleRecur(){
  document.getElementById('cwRecurWrap').classList.toggle('d-none',!document.getElementById('cwRecurToggle').checked);
}
function cwUpdateRecurLabel(){
  const t=document.getElementById('cwRecurType').value;
  document.getElementById('cwRecurLabel').textContent=t==='daily'?'일':t==='weekly'?'주':'월';
}
function cwUpdateNote(){
  const note=document.getElementById('cwNote');
  const cfg=window.cwConfig||{};
  const grpId=parseInt(document.getElementById('cwGroup')?.value)||null;
  const isLeaderOfSel=grpId&&(cfg.leaderGroups||[]).includes(grpId);
  let cls='alert-secondary',msg='';
  if(cwSelVisVal==='private'){cls='alert-secondary';msg='🔒 나만 볼 수 있습니다.';}
  else if(cwSelVisVal==='group'){
    cls=(cfg.isStaff||isLeaderOfSel||cfg.isLeader)?'alert-success':'alert-warning';
    msg=(cfg.isStaff||isLeaderOfSel||cfg.isLeader)?'👥 소모임 멤버에게 즉시 공개됩니다.':'👥 소모임장 승인 후 공개됩니다.';
  }
  else if(cwSelVisVal==='public'){
    cls=cfg.isStaff?'alert-success':'alert-info';
    msg=cfg.isStaff?'🏘 즉시 전체 공개됩니다.':'🏘 관리자 승인 후 전체 공개됩니다.';
  }
  note.className=`alert py-1 small mb-2 ${cls}`; note.textContent=msg;
}

function cwSubmit(){
  if(cwIsEditMode){ cwSubmitEdit(); return; }
  const title=document.getElementById('cwTitle').value.trim();
  const allDay=document.getElementById('cwAllDay').checked;
  const start=allDay?document.getElementById('cwStartDate').value:document.getElementById('cwStart').value;
  if(!title){alert('제목을 입력해주세요.');return;}
  if(!start){alert('시작 시간을 입력해주세요.');return;}
  const isRecur=document.getElementById('cwRecurToggle').checked;
  const recurEnd=document.getElementById('cwRecurEnd').value;
  if(isRecur&&!recurEnd){alert('반복 종료일을 입력해주세요.');return;}
  const endVal=allDay?document.getElementById('cwEndDate').value:document.getElementById('cwEnd').value;
  const cfg=window.cwConfig||{};
  const groupId=cfg.groupId||document.getElementById('cwGroup')?.value||null;

  fetch('/calendar/create/',{
    method:'POST',
    headers:{'Content-Type':'application/json','X-CSRFToken':cwGetCsrf()},
    body:JSON.stringify({
      title,
      event_type:     cwSelTypeVal,
      visibility:     cwSelVisVal,
      color:          cwSelColorVal,
      all_day:        allDay,
      start_time:     allDay?start+' 00:00:00':start.replace('T',' ')+':00',
      end_time:       endVal?(allDay?endVal+' 23:59:00':endVal.replace('T',' ')+':00'):null,
      location:       document.getElementById('cwLocation').value.trim(),
      description:    document.getElementById('cwDesc').value.trim(),
      group_id:       groupId,
      is_recurring:   isRecur,
      recur_type:     document.getElementById('cwRecurType').value,
      recur_interval: parseInt(document.getElementById('cwRecurInterval').value)||1,
      recur_end_date: recurEnd||null,
    })
  }).then(r=>r.json()).then(res=>{
    if(res.success){
      bootstrap.Modal.getInstance(document.getElementById('cwCreateModal')).hide();
      alert(res.approval_note||'일정이 등록됐습니다.');
      cwReload();
    } else alert(res.error||'오류');
  });
}

function cwSubmitEdit(){
  const id=document.getElementById('cwEditId').value;
  if(!id) return;
  const title=document.getElementById('cwTitle').value.trim();
  const start=document.getElementById('cwStart').value;
  if(!title||!start){alert('제목과 시작 시간은 필수입니다.');return;}
  cwSaveEdit(id,{
    title,
    start_time: start.replace('T',' ')+':00',
    end_time:   document.getElementById('cwEnd').value?document.getElementById('cwEnd').value.replace('T',' ')+':00':null,
    location:   document.getElementById('cwLocation').value.trim(),
    description:document.getElementById('cwDesc').value.trim(),
    color:      cwSelColorVal,
  },null,true);
}

function cwSaveEdit(id,data,onError,reload=false){
  fetch(`/calendar/${id}/edit/`,{
    method:'POST',
    headers:{'Content-Type':'application/json','X-CSRFToken':cwGetCsrf()},
    body:JSON.stringify(data)
  }).then(r=>r.json()).then(res=>{
    if(res.success){
      if(reload){bootstrap.Modal.getInstance(document.getElementById('cwCreateModal')).hide();cwReload();}
    } else { if(onError) onError(); alert(res.error||'오류'); }
  });
}

function cwReload(){
  const cfg=window.cwConfig||{};
  if(cfg.groupId){
    cwCalendar.removeAllEvents();
    fetch(`/groups/${cfg.groupId}/calendar/events/`)
      .then(r=>r.json()).then(data=>cwCalendar.addEventSource(data.events||[]));
  } else { location.reload(); }
}

function cwGetCsrf(){
  const v=document.cookie.match('(^|;)\\s*csrftoken\\s*=\\s*([^;]+)');
  return v?v.pop():'';
}
</script>
