{% extends 'base.html' %}
{% block title %}새 비밀번호 설정{% endblock %}
{% block extra_head %}
<style>
  body{background:#f0f7f3;}
  .wrap{min-height:calc(100vh - 52px);display:flex;align-items:center;justify-content:center;padding:20px 16px;}
  .box{width:100%;max-width:400px;background:#fff;border-radius:20px;box-shadow:0 4px 24px rgba(26,122,74,.12);overflow:hidden;}
  .box-header{background:linear-gradient(135deg,#1a7a4a,#1e9158);padding:24px;text-align:center;}
  .box-header h5{color:#fff;font-weight:700;margin:0;}
  .box-body{padding:24px;}
  .fl{margin-bottom:14px;}
  .fl label{display:block;font-size:0.82rem;font-weight:600;color:#374151;margin-bottom:6px;}
  .fl .pw-wrap{position:relative;}
  .fl input{width:100%;padding:12px 44px 12px 14px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;box-sizing:border-box;background:#fafafa;}
  .fl input:focus{border-color:#1a7a4a;box-shadow:0 0 0 3px rgba(26,122,74,.1);background:#fff;}
  .pw-eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#9ca3af;cursor:pointer;}
  .btn-sub{width:100%;padding:13px;background:#1a7a4a;color:#fff;border:none;border-radius:12px;font-size:0.95rem;font-weight:700;cursor:pointer;}
</style>
{% endblock %}
{% block full_content %}
<div class="wrap">
  <div class="box">
    <div class="box-header"><h5>🔐 새 비밀번호 설정</h5></div>
    <div class="box-body">
      {% if messages %}{% for m in messages %}
      <div class="alert alert-{{ m.tags }} mb-3" style="font-size:0.83rem;">{{ m }}</div>
      {% endfor %}{% endif %}
      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="token" value="{{ token }}">
        <div class="fl">
          <label>새 비밀번호 *</label>
          <div class="pw-wrap">
            <input type="password" name="password1" id="pw1" placeholder="8자 이상" required>
            <i class="fas fa-eye pw-eye" onclick="tp('pw1',this)"></i>
          </div>
        </div>
        <div class="fl">
          <label>비밀번호 확인 *</label>
          <div class="pw-wrap">
            <input type="password" name="password2" id="pw2" placeholder="비밀번호 재입력" required>
            <i class="fas fa-eye pw-eye" onclick="tp('pw2',this)"></i>
          </div>
        </div>
        <button type="submit" class="btn-sub"><i class="fas fa-lock me-2"></i>비밀번호 변경</button>
      </form>
    </div>
  </div>
</div>
<script>
function tp(id,icon){var i=document.getElementById(id);if(i.type==='password'){i.type='text';icon.classList.replace('fa-eye','fa-eye-slash');}else{i.type='password';icon.classList.replace('fa-eye-slash','fa-eye');}}
</script>
{% endblock %}
