{% extends "base_3panel.html" %}
{% block title %}통합 캘린더{% endblock %}
{% block panel_extra_head %}
<link href="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/6.1.10/index.global.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/6.1.10/index.global.min.js"></script>
<style>
.fc { font-size: 0.82rem; }
.fc-toolbar-title { font-size: 1rem !important; font-weight: 700; }
.fc-button { font-size: 0.78rem !important; padding: 4px 10px !important; }
.fc-daygrid-event { border-radius: 4px; font-size: 0.72rem; }
.legend-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
@media (max-width: 768px) {
  .fc-toolbar { flex-direction: column; gap: 8px; }
  .fc-toolbar-title { font-size: 0.9rem !important; }
}
</style>
{% endblock %}

{% block panel_content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">📅 통합 캘린더</h4>
  <span class="badge bg-success">총 {{ total_events }}개 일정</span>
</div>

<!-- 범례 -->
<div class="d-flex gap-3 mb-3 flex-wrap">
  <span><span class="legend-dot" style="background:#1a7a4a;"></span> <small>봉사활동</small></span>
  <span><span class="legend-dot" style="background:#e74c3c;"></span> <small>단지행사</small></span>
  <span><span class="legend-dot" style="background:#f39c12;"></span> <small>소모임</small></span>
</div>

<!-- 필터 버튼 -->
<div class="btn-group mb-3 btn-group-sm" role="group">
  <button class="btn btn-outline-success active" onclick="filterEvents('all', this)">전체</button>
  <button class="btn btn-outline-success" onclick="filterEvents('봉사', this)">🤝 봉사</button>
  <button class="btn btn-outline-danger" onclick="filterEvents('행사', this)">📅 행사</button>
  <button class="btn btn-outline-warning" onclick="filterEvents('소모임', this)">👥 소모임</button>
</div>

<!-- 캘린더 -->
<div id="calendar" style="background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);"></div>

<!-- 일정 상세 모달 -->
<div class="modal fade" id="eventModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h6 class="modal-title" id="eventModalTitle"></h6>
        <button type="button" class="btn-close btn-sm" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body py-2" id="eventModalBody"></div>
      <div class="modal-footer py-2">
        <a href="#" id="eventModalLink" class="btn btn-success btn-sm">자세히 보기</a>
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">닫기</button>
      </div>
    </div>
  </div>
</div>

<script>
const allEvents = {{ events_json|safe }};
let calendar;

document.addEventListener('DOMContentLoaded', function() {
  const calendarEl = document.getElementById('calendar');
  calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: window.innerWidth < 768 ? 'listMonth' : 'dayGridMonth',
    locale: 'ko',
    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: 'dayGridMonth,listMonth'
    },
    buttonText: { today: '오늘', month: '월', list: '목록' },
    events: allEvents,
    eventClick: function(info) {
      info.jsEvent.preventDefault();
      const p = info.event.extendedProps;
      document.getElementById('eventModalTitle').textContent = info.event.title;
      document.getElementById('eventModalBody').innerHTML = `
        <div class="mb-1"><span class="badge bg-secondary">${p.type || ''}</span></div>
        ${p.location ? `<div class="small"><i class="fas fa-map-marker-alt text-danger me-1"></i>${p.location}</div>` : ''}
        ${p.participants !== undefined ? `<div class="small mt-1"><i class="fas fa-users text-success me-1"></i>${p.participants}명 참여중</div>` : ''}
        ${p.group ? `<div class="small mt-1"><i class="fas fa-users text-warning me-1"></i>${p.group}</div>` : ''}
        ${p.status ? `<div class="small mt-1 text-muted">상태: ${p.status}</div>` : ''}
      `;
      document.getElementById('eventModalLink').href = info.event.url || '#';
      new bootstrap.Modal(document.getElementById('eventModal')).show();
    },
    eventMouseEnter: function(info) {
      info.el.style.cursor = 'pointer';
      info.el.style.opacity = '0.85';
    },
    eventMouseLeave: function(info) {
      info.el.style.opacity = '1';
    },
    height: 'auto',
    dayMaxEvents: 3,
  });
  calendar.render();
});

function filterEvents(type, btn) {
  document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (type === 'all') {
    calendar.removeAllEvents();
    calendar.addEventSource(allEvents);
  } else {
    const filtered = allEvents.filter(e => e.extendedProps && e.extendedProps.type === type);
    calendar.removeAllEvents();
    calendar.addEventSource(filtered);
  }
}
</script>
{% endblock %}
