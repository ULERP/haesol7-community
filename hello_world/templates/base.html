<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}해솔7 지킴이{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <style>
    /* ── 해솔7 디자인 시스템 v2 ── */
    :root {
      --g: #1a7a4a; --g2: #15623c; --gl: #f0fdf7; --gb: #c6e8d8; --gm: #d1f0e2;
      --bg: #ffffff; --bg2: #f8fafb; --bg3: #eef1f5;
      --text1: #111827; --text2: #374151; --text3: #6b7280; --text4: #9ca3af;
      --border: #e5e7eb; --border2: #d1d5db;
      --shadow: 0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
      --shadow2: 0 4px 16px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
      --radius: 12px; --radius-sm: 8px; --radius-lg: 16px;
      --nav-h: 52px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      background: #f8fafb;
      color: var(--text2);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      font-size: 14px; line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      padding-top: var(--nav-h); margin: 0;
    }
    /* 카드 */
    .card { background:#fff; border:1px solid var(--border)!important; border-radius:var(--radius)!important; box-shadow:var(--shadow)!important; }
    .card-header { background:#fff!important; border-bottom:1px solid var(--border)!important; padding:14px 18px!important; font-weight:600; font-size:0.88rem; color:var(--text1); }
    .card-header.text-white, .card-header.text-white * { color:#fff!important; }
    .card-body { padding:18px!important; }
    /* 버튼 */
    .btn { border-radius:var(--radius-sm)!important; font-weight:600; font-size:0.86rem; transition:all .15s; }
    .btn-success, .btn-success:focus { background:var(--g)!important; border-color:var(--g)!important; color:#fff!important; }
    .btn-success:hover { background:var(--g2)!important; border-color:var(--g2)!important; }
    .btn-outline-success { border-color:var(--g)!important; color:var(--g)!important; }
    .btn-outline-success:hover { background:var(--gl)!important; color:var(--g)!important; border-color:var(--g)!important; }
    .btn-primary { background:#2563eb!important; border-color:#2563eb!important; }
    .btn-primary:hover { background:#1d4ed8!important; }
    /* 폼 */
    .form-control, .form-select {
      border:1px solid var(--border2)!important; border-radius:var(--radius-sm)!important;
      font-size:0.88rem!important; padding:9px 12px!important;
      background:#fff!important; color:var(--text1)!important;
      transition:border-color .15s, box-shadow .15s;
    }
    .form-control:focus, .form-select:focus {
      border-color:var(--g)!important;
      box-shadow:0 0 0 3px rgba(26,122,74,.1)!important; outline:none!important;
    }
    .form-label { font-size:0.83rem!important; font-weight:600!important; color:var(--text2)!important; margin-bottom:5px!important; }
    .form-text { font-size:0.76rem!important; color:var(--text4)!important; }
    /* 테이블 */
    .table { font-size:0.86rem; }
    .table th { font-weight:600; color:var(--text3); background:var(--bg2)!important; border-bottom:1px solid var(--border)!important; padding:10px 14px!important; }
    .table td { color:var(--text2); border-bottom:1px solid var(--border)!important; padding:10px 14px!important; vertical-align:middle; }
    .table-hover tbody tr:hover { background:var(--gl)!important; }
    /* 배지 */
    .badge { border-radius:6px!important; font-size:0.72rem!important; font-weight:600!important; padding:3px 8px!important; }
    .badge.bg-success { background:var(--g)!important; }
    /* 알림 */
    .alert { border-radius:var(--radius)!important; font-size:0.86rem!important; border:none!important; }
    .alert-success { background:var(--gl)!important; color:var(--g2)!important; }
    .alert-info { background:#eff6ff!important; color:#1d4ed8!important; }
    .alert-warning { background:#fffbeb!important; color:#92400e!important; }
    .alert-danger { background:#fef2f2!important; color:#991b1b!important; }
    /* 페이지네이션 */
    .page-link { border-radius:var(--radius-sm)!important; border:1px solid var(--border)!important; color:var(--text2)!important; font-size:0.84rem!important; margin:0 2px; }
    .page-item.active .page-link { background:var(--g)!important; border-color:var(--g)!important; color:#fff!important; }
    /* 드롭다운 */
    .dropdown-menu { border:1px solid var(--border)!important; border-radius:var(--radius)!important; box-shadow:var(--shadow2)!important; padding:6px!important; }
    .dropdown-item { border-radius:var(--radius-sm)!important; padding:8px 12px!important; color:var(--text2)!important; font-size:0.86rem!important; }
    .dropdown-item:hover { background:var(--gl)!important; color:var(--g)!important; }
    /* 링크 */
    a { color:var(--g); text-decoration:none; }
    a:hover { color:var(--g2); }
    /* 구분선 */
    hr { border-color:var(--border)!important; opacity:1!important; margin:1rem 0; }
    /* 유틸 */
    .text-success { color:var(--g)!important; }
    .bg-success { background:var(--g)!important; }
    .border-success { border-color:var(--g)!important; }
    .text-muted { color:var(--text3)!important; }
    /* 컨테이너 */
    .container { max-width:1140px; }
    /* 페이지 헤더 */
    .page-header { margin-bottom:1.5rem; }
    .page-header h1, .page-header h2, .page-header h3 { font-weight:700; color:var(--text1); margin:0 0 4px; }
    .page-header p { color:var(--text3); margin:0; font-size:0.88rem; }
    /* 섹션 */
    .section-title { font-size:0.75rem; font-weight:700; color:var(--text4); text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px; }
    /* 빈 상태 */
    .empty-state { text-align:center; padding:40px 20px; color:var(--text4); }
    .empty-state i { font-size:2.5rem; display:block; margin-bottom:12px; opacity:.4; }
    .empty-state p { font-size:0.88rem; margin:0; }
    /* navbar */
    .navbar { background:var(--g)!important; }
    .navbar-brand { color:#fff!important; }
    .nav-link { color:rgba(255,255,255,.85)!important; }
    .nav-link:hover, .nav-link.active { color:#fff!important; }
  /* 사이드바 섹션 폴딩 */
  .sb-label{font-size:0.93rem;font-weight:700;color:#6b7280;text-transform:none;letter-spacing:.01em;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;border-radius:8px;transition:all .15s;background:#f3f4f6;margin-bottom:2px;}
  .sb-label:hover{background:#e9f5ee;color:#1a7a4a;}
  .sb-label.folded{background:#f9fafb;color:#9ca3af;}
  .sb-label.folded:hover{background:#f0fdf7;color:#1a7a4a;}
  .sb-label .sb-fold-icon{font-size:0.6rem;transition:transform 0.2s;opacity:0.5;}
  .sb-label.folded .sb-fold-icon{transform:rotate(-90deg);}
  .sb-section{overflow:hidden;transition:max-height 0.25s ease;}
  .sb-section.folded{max-height:0!important;}
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
{% include "partials/navbar.html" %}
{% block full_content %}
  <div class="container py-4">
    {% block content %}{% endblock %}
  </div>
{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  {% if user.is_authenticated %}
  async function updateNotiCount() {
    try {
      const res = await fetch('/notifications/count/');
      const data = await res.json();
      const dot = document.getElementById('noti-dot');
      if (!dot) return;
      dot.style.display = data.count > 0 ? 'block' : 'none';
    } catch(e) {}
  }
  updateNotiCount();
  setInterval(updateNotiCount, 30000);
  {% endif %}
</script>
<script>
function toggleSection(id) {
  const sec = document.getElementById(id);
  const label = sec ? sec.previousElementSibling : null;
  if (!sec) return;
  if (sec.classList.contains('folded')) {
    sec.classList.remove('folded');
    sec.style.maxHeight = sec.scrollHeight + 'px';
    if (label) label.classList.remove('folded');
    try { localStorage.setItem('sb_fold_' + id, '0'); } catch(e) {}
  } else {
    sec.style.maxHeight = sec.scrollHeight + 'px';
    requestAnimationFrame(() => { sec.style.maxHeight = '0'; });
    sec.classList.add('folded');
    if (label) label.classList.add('folded');
    try { localStorage.setItem('sb_fold_' + id, '1'); } catch(e) {}
  }
}
(function() {
  const secs = ['sec-chat','sec-record','sec-together','sec-news','sec-myact','sec-admin'];
  secs.forEach(id => {
    const sec = document.getElementById(id);
    const label = sec ? sec.previousElementSibling : null;
    const saved = localStorage.getItem('sb_fold_' + id);
    if (saved === '0') {
      if (sec) sec.style.maxHeight = sec.scrollHeight + 'px';
    } else {
      if (sec) { sec.classList.add('folded'); sec.style.maxHeight = '0'; }
      if (label) label.classList.add('folded');
    }
  });
})();
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
