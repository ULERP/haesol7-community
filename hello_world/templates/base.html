<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}해솔7 지킴이{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    :root { --haesol-green: #1a7a4a; --haesol-light: #e8f5ee; --nav-h: 52px; }
    body { background: #f4f6f8; margin: 0; padding-top: var(--nav-h); }
    .navbar { background: var(--haesol-green) !important; }
    .navbar-brand { color: #fff !important; font-size: 1.2rem; }
    .nav-link { color: rgba(255,255,255,0.85) !important; }
    .nav-link:hover, .nav-link.active { color: #fff !important; }
    .noti-badge { font-size: 0.55rem; min-width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
{% include "partials/navbar.html" %}
{% block full_content %}
  <div class="container py-4">
    {% block content %}{% endblock %}
  </div>
{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  {% if user.is_authenticated %}
  async function updateNotiCount() {
    try {
      const res = await fetch('/notifications/count/');
      const data = await res.json();
      const dot = document.getElementById('noti-dot');
      if (!dot) return;
      if (data.count > 0) dot.style.display = 'block';
      else dot.style.display = 'none';
    } catch(e) {}
  }
  updateNotiCount();
  setInterval(updateNotiCount, 30000);
  {% endif %}
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
