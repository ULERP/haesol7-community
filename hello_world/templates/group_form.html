{% extends 'base_2panel.html' %}
{% block menu_groups %}active{% endblock %}
{% block title %}소모임 만들기{% endblock %}
{% block content %}
<div class="card border-0" style="border-radius:16px;overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,.08);max-width:700px;margin:0 auto;">
  <div class="p-4" style="background:linear-gradient(135deg,#1a7a4a,#1e9158);">
    <h5 class="text-white fw-bold mb-1"><i class="fas fa-users me-2"></i>새 소모임 만들기</h5>
    <p class="text-white mb-0" style="opacity:.8;font-size:0.82rem;">이웃과 함께하는 소모임을 시작해보세요 🌿</p>
  </div>
  <div class="p-4">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">소모임 이름 <span class="text-danger">*</span></label>
        <input type="text" name="name" class="form-control" placeholder="예: 해솔 산책단, 독서모임">
      </div>
      <div class="mb-3">
        <label class="form-label">소개글 <span class="text-danger">*</span></label>
        <textarea name="description" class="form-control" rows="3" placeholder="소모임을 소개해주세요"></textarea>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">유형</label>
          <select name="group_type" class="form-select">
            {% for val, label in group_types %}
            <option value="{{ val }}">{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">가입 방식</label>
          <select name="join_type" class="form-select">
            <option value="open">🔓 자유가입</option>
            <option value="approve">✅ 승인제</option>
            <option value="invite">🔒 초대제</option>
          </select>
        </div>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">최대 인원</label>
          <input type="number" name="member_limit" class="form-control" placeholder="제한 없음" min="2" max="100">
          <div class="form-text">💡 10인 이상은 관리자 승인이 필요해요</div>
        </div>
        <div class="col-md-6">
          <label class="form-label">활동 장소</label>
          <input type="text" name="location" class="form-control" placeholder="예: 단지 내 공원">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">정기 일정</label>
        <input type="text" name="regular_schedule" class="form-control" placeholder="예: 매주 토요일 오전 10시">
      </div>
      <div class="mb-3">
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" name="is_limited" id="isLimited" onchange="toggleExpiry()">
          <label class="form-check-label" for="isLimited">기간 한정 소모임</label>
        </div>
        <div id="expiryWrap" class="mt-2 d-none">
          <label class="form-label small">해체 예정일</label>
          <input type="datetime-local" name="expires_at" class="form-control form-control-sm">
        </div>
      </div>
      <div class="mb-4">
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" name="is_public" id="isPublic" checked>
          <label class="form-check-label" for="isPublic">공개 소모임 (목록에 표시)</label>
        </div>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success px-4"><i class="fas fa-plus me-1"></i>소모임 만들기</button>
        <a href="/groups/" class="btn btn-outline-secondary px-4">취소</a>
      </div>
    </form>
  </div>
</div>
<script>
function toggleExpiry() {
  document.getElementById('expiryWrap').classList.toggle('d-none', !document.getElementById('isLimited').checked);
}
</script>
{% endblock %}
