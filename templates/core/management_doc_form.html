{% extends 'base.html' %}
{% block title %}관리 문서 {{ action }}{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:700px">
  <h3 class="mb-4"><i class="fas fa-file-alt me-2 text-primary"></i>관리 문서 {{ action }}</h3>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label fw-semibold">카테고리 <span class="text-danger">*</span></label>
      <input type="text" name="category" class="form-control" 
             placeholder="예: 주차, 펫, 소음, 관리규약" value="{{ doc.category|default:'' }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">제목 <span class="text-danger">*</span></label>
      <input type="text" name="title" class="form-control" 
             placeholder="문서 제목" value="{{ doc.title|default:'' }}" required>
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold">내용 <span class="text-danger">*</span></label>
      <textarea name="content" class="form-control" rows="15" 
                placeholder="문서 내용을 입력하세요..." required>{{ doc.content|default:'' }}</textarea>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">
        <i class="fas fa-save me-1"></i>{{ action }}
      </button>
      <a href="{% url 'management_doc_list' %}" class="btn btn-outline-secondary">취소</a>
    </div>
  </form>
</div>
{% endblock %}
