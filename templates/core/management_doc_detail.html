{% extends 'base.html' %}
{% block title %}{{ doc.title }}{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:800px">
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="{% url 'management_doc_list' %}">관리 문서</a></li>
      <li class="breadcrumb-item active">{{ doc.title }}</li>
    </ol>
  </nav>
  <div class="card shadow-sm">
    <div class="card-header d-flex justify-content-between align-items-center">
      <div>
        <span class="badge bg-secondary me-2">{{ doc.category }}</span>
        <span class="fw-bold fs-5">{{ doc.title }}</span>
      </div>
      {% if user.is_staff %}
      <div>
        <a href="{% url 'management_doc_edit' doc.pk %}" class="btn btn-sm btn-outline-secondary me-1">
          <i class="fas fa-edit"></i> 수정
        </a>
        <a href="{% url 'management_doc_delete' doc.pk %}" class="btn btn-sm btn-outline-danger">
          <i class="fas fa-trash"></i> 삭제
        </a>
      </div>
      {% endif %}
    </div>
    <div class="card-body">
      <div class="text-muted small mb-3">최종 수정: {{ doc.updated_at|date:"Y년 m월 d일 H:i" }}</div>
      <div style="white-space: pre-wrap; line-height: 1.8;">{{ doc.content }}</div>
    </div>
  </div>
  <div class="mt-3">
    <a href="{% url 'management_doc_list' %}" class="btn btn-outline-secondary btn-sm">
      <i class="fas fa-list me-1"></i>목록으로
    </a>
  </div>
</div>
{% endblock %}
