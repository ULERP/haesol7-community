{% extends 'base.html' %}
{% block title %}모임 글쓰기{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:700px">
  <h3 class="mb-4"><i class="fas fa-pen text-primary me-2"></i>{{ group.name }} 글쓰기</h3>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label fw-semibold">제목</label>
      <input type="text" name="title" class="form-control" required>
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold">내용</label>
      <textarea name="content" class="form-control" rows="10" required></textarea>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>작성</button>
      <a href="{% url 'group_detail' group.pk %}" class="btn btn-outline-secondary">취소</a>
    </div>
  </form>
</div>
{% endblock %}
