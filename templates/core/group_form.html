{% extends 'base.html' %}
{% block title %}모임 만들기{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:650px">
  <h3 class="mb-4"><i class="fas fa-users text-success me-2"></i>새 모임 만들기</h3>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label fw-semibold">모임 종류 <span class="text-danger">*</span></label>
      <select name="group_type" class="form-select" required>
        <option value="">선택하세요</option>
        {% for value, label in group_types %}
        <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">모임 이름 <span class="text-danger">*</span></label>
      <input type="text" name="name" class="form-control" placeholder="예: 강아지 산책 모임" required>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">소개 <span class="text-danger">*</span></label>
      <textarea name="description" class="form-control" rows="4" placeholder="모임을 간략하게 소개해주세요" required></textarea>
    </div>
    <div class="row g-2 mb-3">
      <div class="col-md-6">
        <label class="form-label fw-semibold">모임 장소</label>
        <input type="text" name="location" class="form-control" placeholder="예: 단지 내 공원">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">정기 일정</label>
        <input type="text" name="regular_schedule" class="form-control" placeholder="예: 매주 토요일 오전 10시">
      </div>
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold">최대 인원 (선택)</label>
      <input type="number" name="member_limit" class="form-control" placeholder="제한 없으면 비워두세요" min="2">
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-success"><i class="fas fa-plus me-1"></i>만들기</button>
      <a href="{% url 'group_list' %}" class="btn btn-outline-secondary">취소</a>
    </div>
  </form>
</div>
{% endblock %}
