{% extends 'base.html' %}
{% block title %}이웃 평가하기{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:500px">
  <h3 class="mb-4"><i class="fas fa-heart text-danger me-2"></i>{{ target_user.username }}님 평가하기</h3>
  <form method="post">
    {% csrf_token %}
    <div class="mb-4">
      <label class="form-label fw-semibold">온기 점수</label>
      <div class="d-flex gap-3 fs-3">
        {% for i in score_range %}
        <div class="form-check form-check-inline">
          <input class="form-check-input visually-hidden" type="radio" name="score" id="score{{ i }}" value="{{ i }}"
            {% if existing and existing.score == i %}checked{% elif not existing and i == 5 %}checked{% endif %}>
          <label class="form-check-label" for="score{{ i }}" style="cursor:pointer;">⭐</label>
        </div>
        {% endfor %}
      </div>
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold">한마디 (선택)</label>
      <textarea name="comment" class="form-control" rows="3" 
                placeholder="이웃과의 좋은 경험을 나눠주세요">{{ existing.comment|default:'' }}</textarea>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-danger">
        <i class="fas fa-heart me-1"></i>{% if existing %}수정{% else %}평가{% endif %}
      </button>
      <a href="{% url 'rating_list' %}" class="btn btn-outline-secondary">취소</a>
    </div>
  </form>
</div>
{% endblock %}
